services:
  - type: web
    name: online-tender-management
    env: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn tenderx_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
